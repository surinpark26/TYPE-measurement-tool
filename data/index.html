<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 뷰어 — 보진재 연구툴</title>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f0efe9;--surface:#fff;--border:#dddad3;--border-lt:#ece9e3;
  --text:#1a1a1a;--text-2:#555;--text-3:#999;
  --accent:#2563eb;--accent-bg:#eff6ff;
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-border:#bbf7d0;
  --warn:#d97706;--warn-bg:#fffbeb;
  --err:#dc2626;--err-bg:#fef2f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
  --radius-sm:4px;--radius:6px;--radius-lg:12px;--nav-h:48px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:inherit;}
input,select{font-family:inherit;}
.hidden{display:none!important;}

/* NAV */
.site-nav{height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;}
.site-nav__brand{font-size:12px;font-weight:800;padding-right:16px;border-right:1px solid var(--border);margin-right:12px;white-space:nowrap;}
.site-nav__brand span{color:var(--accent);}
.site-nav__links{display:flex;gap:2px;flex:1;}
.site-nav__link{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--radius);font-size:11px;font-weight:700;color:var(--text-3);transition:all .12s;}
.site-nav__link:hover{background:var(--bg);color:var(--text);}
.site-nav__link.is-active{background:var(--ok);color:#fff;}
.site-nav__right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.gh-cfg-btn{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid var(--border);cursor:pointer;white-space:nowrap;}
.gh-cfg-btn--on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border);}
.gh-cfg-btn--off{background:var(--bg);color:var(--text-3);}

.btn{padding:5px 11px;border:none;border-radius:var(--radius);font-size:11px;font-weight:700;cursor:pointer;transition:filter .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.btn:hover{filter:brightness(1.1);}
.btn--ghost{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.btn--ok{background:var(--ok);color:#fff;}
.btn--accent{background:var(--accent);color:#fff;}
.btn--sm{padding:3px 8px;font-size:10px;}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.toolbar__sep{width:1px;height:18px;background:var(--border);flex-shrink:0;}
.toolbar__label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}

/* MAIN LAYOUT */
.main{flex:1;display:flex;overflow:hidden;min-height:0;}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);}
.sidebar__head{padding:10px 12px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border-lt);display:flex;align-items:center;justify-content:space-between;}
.sidebar__list{flex:1;overflow-y:auto;}
.file-item{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border-lt);transition:background .1s;font-size:12px;}
.file-item:hover{background:var(--bg);}
.file-item.is-active{background:var(--accent-bg);border-left:2px solid var(--accent);}
.file-item__icon{font-size:14px;flex-shrink:0;}
.file-item__info{flex:1;min-width:0;}
.file-item__name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-item__meta{font-size:10px;color:var(--text-3);}

/* CONTENT */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.content__tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 14px;background:var(--surface);flex-shrink:0;flex-wrap:wrap;}
.tab-btn{padding:9px 14px;font-size:11px;font-weight:700;color:var(--text-3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.is-active{color:var(--accent);border-bottom-color:var(--accent);}
.content__body{flex:1;overflow:auto;padding:14px;}

/* EMPTY STATE */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--text-3);}
.empty__icon{font-size:40px;}
.empty__text{font-size:13px;font-weight:700;}
.empty__sub{font-size:11px;}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:11px;}
.data-table th{background:#f7f5f0;padding:5px 8px;text-align:left;font-weight:700;color:var(--text-3);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--border-lt);white-space:nowrap;}
.data-table tr:hover td{background:var(--accent-bg);}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--purple);font-weight:700;}
.data-table .char{font-size:18px;font-weight:700;text-align:center;}

/* STATS CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.stat-card__label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;margin-bottom:4px;}
.stat-card__val{font-size:20px;font-weight:800;color:var(--text);}
.stat-card__sub{font-size:10px;color:var(--text-3);margin-top:2px;}

/* CHART AREA */
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
.chart-wrap h3{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;margin-bottom:10px;}
.bar-chart{display:flex;flex-direction:column;gap:6px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-row__label{width:32px;font-size:14px;font-weight:700;text-align:center;flex-shrink:0;}
.bar-row__name{width:80px;font-size:10px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.bar-row__track{flex:1;height:14px;background:#e5e5e5;border-radius:7px;overflow:hidden;position:relative;}
.bar-row__fill{height:100%;border-radius:7px;transition:width .4s;}
.bar-row__val{width:52px;font-size:10px;font-weight:700;color:var(--purple);text-align:right;flex-shrink:0;}

/* SCATTER */
.scatter-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
.scatter-wrap h3{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;margin-bottom:8px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:22px 24px;width:440px;max-width:95vw;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h2{font-size:14px;font-weight:700;}
.modal label{font-size:11px;font-weight:700;color:var(--text-3);display:block;margin-bottom:3px;}
.modal input{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:#f7f5f0;color:var(--text);}
.modal__row{display:flex;gap:8px;}
.modal__status{font-size:11px;min-height:16px;}
.status--ok{color:var(--ok);}.status--err{color:var(--err);}.status--info{color:var(--accent);}

/* ── 필터 패널 ── */
.filter-panel {
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0;
}
.filter-section {
  display:flex; align-items:flex-start; gap:10px;
  padding:7px 14px; border-bottom:1px solid var(--border-lt);
  flex-wrap:wrap;
}
.filter-section:last-child { border-bottom:none; }
.filter-section__label {
  font-size:10px; font-weight:800; color:var(--text-3);
  text-transform:uppercase; letter-spacing:.3px;
  min-width:44px; padding-top:3px; flex-shrink:0;
}
.filter-group { display:flex; align-items:center; gap:3px; flex-wrap:wrap; }
.filter-group__sep {
  font-size:9px; color:var(--text-3); padding:0 3px; line-height:1.8;
}
.fbtn {
  padding:2px 8px; font-size:11px; font-weight:700;
  border:1.5px solid var(--border); border-radius:4px;
  background:var(--bg); color:var(--text-2); cursor:pointer;
  transition:all .1s; white-space:nowrap; line-height:1.5;
  font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
}
.fbtn:hover { border-color:#aaa; background:#eeece6; }
.fbtn.is-on { background:var(--accent); color:#fff; border-color:var(--accent); }
/* 카테고리별 색상 */
.fbtn--cho.is-on  { background:#7c3aed; border-color:#7c3aed; }
.fbtn--jung.is-on { background:var(--ok); border-color:var(--ok); }
.fbtn--jong.is-on { background:var(--orange); border-color:var(--orange); }
.fbtn--moim.is-on { background:var(--accent); border-color:var(--accent); }
.fbtn--batch.is-on{ background:var(--warn); border-color:var(--warn); }
/* 전체 버튼 */
.fbtn--all { opacity:.6; }
.fbtn--all.is-on { opacity:1; background:#555; border-color:#555; color:#fff; }
/* 선택 배지 */
.filter-badge {
  display:inline-flex; align-items:center; gap:3px;
  background:var(--accent-bg); border:1px solid #bfdbfe;
  border-radius:20px; padding:1px 7px; font-size:10px; font-weight:700; color:var(--accent);
}

/* ── 비교 표 ── */
.cmp-section { margin-bottom:18px; }
.cmp-section__title {
  font-size:12px; font-weight:800; color:var(--text);
  padding:7px 10px; background:#f0efe9; border-radius:var(--radius) var(--radius) 0 0;
  border:1px solid var(--border); border-bottom:none;
  display:flex; align-items:center; gap:8px;
}
.cmp-section__title .badge {
  font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px;
  background:var(--accent); color:#fff;
}
.cmp-table { width:100%; border-collapse:collapse; font-size:11px;
  border:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius); overflow:hidden; }
.cmp-table th {
  background:#f7f5f0; padding:5px 8px; text-align:center;
  font-weight:700; color:var(--text-3); border-bottom:2px solid var(--border);
  border-right:1px solid var(--border-lt); white-space:nowrap;
}
.cmp-table th.th-group {
  background:#ece9e3; font-size:10px; text-transform:uppercase; letter-spacing:.3px;
}
.cmp-table td {
  padding:4px 8px; border-bottom:1px solid var(--border-lt);
  border-right:1px solid var(--border-lt); text-align:right; white-space:nowrap;
}
.cmp-table td.td-label {
  text-align:left; font-weight:700; color:var(--text);
  background:#fafaf7; position:sticky; left:0; z-index:1;
  border-right:2px solid var(--border);
}
.cmp-table td.td-n { color:var(--text-3); font-size:10px; }
.cmp-table td.td-avg { font-weight:700; color:var(--purple); }
.cmp-table td.td-med { color:var(--accent); }
.cmp-table td.td-min { color:var(--ok); }
.cmp-table td.td-max { color:var(--err); }
.cmp-table tr:hover td { background:var(--accent-bg); }
.cmp-table tr:hover td.td-label { background:#e8f0fe; }
.cmp-wrap { overflow-x:auto; }
.cmp-tabs { display:flex; gap:2px; margin-bottom:12px; flex-wrap:wrap; }
.cmp-tab {
  padding:4px 12px; font-size:11px; font-weight:700;
  border:1px solid var(--border); border-radius:20px;
  background:var(--bg); color:var(--text-3); cursor:pointer;
}
.cmp-tab:hover { background:var(--border-lt); color:var(--text); }
.cmp-tab.is-active { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="site-nav__brand" href="../"><span>보진재</span> 연구툴</a>
  <div class="site-nav__links">
    <a class="site-nav__link home-link" href="../">홈</a>
    <a class="site-nav__link tool-link" href="../tool/">📐 측정툴</a>
    <a class="site-nav__link data-link is-active" href="../data/">📊 데이터 뷰어</a>
    <a class="site-nav__link images-link" href="../images/">🖼 이미지 관리</a>
  </div>
  <div class="site-nav__right">
    <button class="btn btn--ghost btn--sm" id="btnLoadLocal">📂 로컬 파일</button>
    <span class="gh-cfg-btn gh-cfg-btn--off" id="ghCfgBtn" onclick="openGhModal()">☁ GitHub 설정</span>
    <input type="file" id="localFileIn" accept=".csv,.xlsx,.xls" style="display:none" multiple>
  </div>
</nav>

<!-- 필터 패널 -->
<div class="filter-panel" id="filterPanel">

  <!-- 섹션 1: 모임꼴 / 받침 -->
  <div class="filter-section">
    <span class="filter-section__label">모임꼴</span>
    <div class="filter-group" id="fg-moim">
      <button class="fbtn fbtn--moim" data-g="moim" data-v="가로모임꼴">가로모임꼴</button>
      <button class="fbtn fbtn--moim" data-g="moim" data-v="세로모임꼴">세로모임꼴</button>
      <button class="fbtn fbtn--moim" data-g="moim" data-v="섞임모임꼴">섞임모임꼴</button>
    </div>
    <div class="filter-group__sep">|</div>
    <span class="filter-section__label" style="min-width:28px;">받침</span>
    <div class="filter-group" id="fg-batch">
      <button class="fbtn fbtn--batch" data-g="batch" data-v="민글자">민글자</button>
      <button class="fbtn fbtn--batch" data-g="batch" data-v="받침">받침글자</button>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
      <span id="filterBadge" style="font-size:11px;color:var(--text-3);"></span>
      <button class="btn btn--ghost btn--sm" id="btnResetFilter" style="font-size:10px;padding:2px 8px;">↺ 초기화</button>
    </div>
  </div>

  <!-- 섹션 2: 첫닿자 / 홀자 / 받침닿자 -->
  <div class="filter-section">
    <span class="filter-section__label">첫닿자</span>
    <div class="filter-group" id="fg-cho">
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㄱ">ㄱ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㄴ">ㄴ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㄷ">ㄷ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㄹ">ㄹ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅁ">ㅁ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅂ">ㅂ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅅ">ㅅ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅇ">ㅇ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅈ">ㅈ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅊ">ㅊ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅋ">ㅋ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅌ">ㅌ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅍ">ㅍ</button>
      <button class="fbtn fbtn--cho" data-g="cho" data-v="ㅎ">ㅎ</button>
    </div>
  </div>
  <div class="filter-section">
    <span class="filter-section__label">홀자</span>
    <div class="filter-group" id="fg-jung">
      <span class="filter-group__sep">가로</span>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅏ">ㅏ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅑ">ㅑ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅓ">ㅓ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅕ">ㅕ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅣ">ㅣ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅐ">ㅐ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅒ">ㅒ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅔ">ㅔ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅖ">ㅖ</button>
      <span class="filter-group__sep">세로</span>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅗ">ㅗ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅛ">ㅛ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅜ">ㅜ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅠ">ㅠ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅡ">ㅡ</button>
      <span class="filter-group__sep">섞임</span>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅘ">ㅘ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅙ">ㅙ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅚ">ㅚ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅝ">ㅝ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅞ">ㅞ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅟ">ㅟ</button>
      <button class="fbtn fbtn--jung" data-g="jung" data-v="ㅢ">ㅢ</button>
    </div>
  </div>
  <div class="filter-section">
    <span class="filter-section__label">받침닿자</span>
    <div class="filter-group" id="fg-jong">
      <button class="fbtn fbtn--jong" data-g="jong" data-v="없음">없음</button>
      <span class="filter-group__sep">단</span>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄱ">ㄱ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄴ">ㄴ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄷ">ㄷ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄹ">ㄹ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅁ">ㅁ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅂ">ㅂ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅅ">ㅅ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅇ">ㅇ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅈ">ㅈ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅊ">ㅊ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅋ">ㅋ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅌ">ㅌ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅍ">ㅍ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㅎ">ㅎ</button>
      <span class="filter-group__sep">겹</span>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄳ">ㄳ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄵ">ㄵ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄶ">ㄶ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄺ">ㄺ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄻ">ㄻ</button>
      <button class="fbtn fbtn--jong" data-g="jong" data-v="ㄼ">ㄼ</button>

<script>
'use strict';

// ── GitHub 설정 ──────────────────────────────────────────────
const GH_KEY='bonjinjae_gh_cfg';
function ghLoadCfg(){try{return JSON.parse(localStorage.getItem(GH_KEY))||{};}catch{return{};}}
function ghValid(cfg){return cfg.token&&cfg.owner&&cfg.dataRepo;}

function openGhModal(){
  const cfg=ghLoadCfg();
  document.getElementById('ghToken').value=cfg.token||'';
  document.getElementById('ghOwner').value=cfg.owner||'';
  document.getElementById('ghDataRepo').value=cfg.dataRepo||'bojinjae';
  document.getElementById('ghDataFolder').value=cfg.dataFolder||'data';
  document.getElementById('ghModalStatus').textContent='';
  document.getElementById('ghModal').classList.remove('hidden');
}
function closeGhModal(){document.getElementById('ghModal').classList.add('hidden');}
document.getElementById('ghModal').addEventListener('click',e=>{if(e.target.id==='ghModal')closeGhModal();});

function ghSetStatus(msg,type='info'){
  const el=document.getElementById('ghModalStatus');
  el.textContent=msg;el.className='modal__status status--'+type;
}
async function ghTest(){
  const cfg={token:document.getElementById('ghToken').value.trim(),owner:document.getElementById('ghOwner').value.trim(),dataRepo:document.getElementById('ghDataRepo').value.trim()};
  if(!cfg.token||!cfg.owner||!cfg.dataRepo){ghSetStatus('필수 항목 입력 필요','err');return;}
  ghSetStatus('확인 중…','info');
  try{
    const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.dataRepo}`,{headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}});
    if(r.ok)ghSetStatus('✓ 연결 성공!','ok');
    else{const e=await r.json();ghSetStatus('오류: '+e.message,'err');}
  }catch(e){ghSetStatus('오류: '+e.message,'err');}
}
function ghSaveCfg(){
  const cfg={token:document.getElementById('ghToken').value.trim(),owner:document.getElementById('ghOwner').value.trim(),dataRepo:document.getElementById('ghDataRepo').value.trim(),dataFolder:document.getElementById('ghDataFolder').value.trim()};
  if(!cfg.token||!cfg.owner||!cfg.dataRepo){ghSetStatus('필수 항목 입력 필요','err');return;}
  localStorage.setItem(GH_KEY,JSON.stringify(cfg));
  updateGhBtn();
  ghSidebarLoad(cfg.dataFolder||'');
  closeGhModal();
}
function updateGhBtn(){
  const cfg=ghLoadCfg();const btn=document.getElementById('ghCfgBtn');
  if(ghValid(cfg)){
    btn.textContent=`☁ ${cfg.owner}/${cfg.dataRepo}`;btn.className='gh-cfg-btn gh-cfg-btn--on';
    // 설정이 있으면 자동으로 dataFolder 로드
    ghSidebarLoad(cfg.dataFolder||'');
  } else {
    btn.textContent='☁ GitHub 설정';btn.className='gh-cfg-btn gh-cfg-btn--off';
  }
}
updateGhBtn();

// ── 데이터 상태 ──────────────────────────────────────────────
let allFiles = []; // {name, rows:[]}
let curFileIdx = -1;
let curTab = 'table';

function curRows(){
  if(curFileIdx<0||curFileIdx>=allFiles.length) return [];
  return allFiles[curFileIdx].rows;
}


/* ── 한글 자모 분해 ── */
const CHO  = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG  = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function decomposeHangul(ch) {
  const code = ch && ch.charCodeAt(0);
  if (!code || code < 0xAC00 || code > 0xD7A3) return null;
  const offset = code - 0xAC00;
  return {
    cho:  CHO[Math.floor(offset / 28 / 21)],
    jung: JUNG[Math.floor(offset / 28) % 21],
    jong: JONG[offset % 28],
  };
}

/* ── 필터 상태 — 다중선택 Set ── */
const filterSets = { moim: new Set(), batch: new Set(), cho: new Set(), jung: new Set(), jong: new Set() };

// 필터 패널 이벤트 위임
document.getElementById('filterPanel').addEventListener('click', e => {
  const btn = e.target.closest('.fbtn[data-g]'); if (!btn) return;
  const g = btn.dataset.g, v = btn.dataset.v;
  if (!filterSets[g]) return;
  if (filterSets[g].has(v)) filterSets[g].delete(v);
  else filterSets[g].add(v);
  btn.classList.toggle('is-on', filterSets[g].has(v));
  updateFilterBadge();
  renderContent();
});

function updateFilterBadge() {
  const total = Object.values(filterSets).reduce((s,st)=>s+st.size,0);
  const badge = document.getElementById('filterBadge');
  if (badge) badge.textContent = total > 0 ? total + '개 필터 적용 중' : '';
}

document.getElementById('btnResetFilter').addEventListener('click', () => {
  Object.values(filterSets).forEach(s => s.clear());
  document.querySelectorAll('.fbtn[data-g]').forEach(b => b.classList.remove('is-on'));
  updateFilterBadge();
  renderContent();
});

function filteredRows(){
  let rows=curRows();
  const m    = filterSets.moim;
  const b    = filterSets.batch;
  const cho  = filterSets.cho;
  const jung = filterSets.jung;
  const jong = filterSets.jong;
  const keys=Object.keys(rows[0]||{});
  const moimKey=keys.find(k=>k==='모임꼴')||'모임꼴';
  const batKey=keys.find(k=>k==='받침여부')||'받침여부';
  const charKey=keys.find(k=>k==='글자')||'글자';

  // 모임꼴 — OR (선택된 것 중 하나라도 해당)
  if(m.size) rows=rows.filter(r=>m.has(r[moimKey]));

  // 받침 — OR
  if(b.size) rows=rows.filter(r=>{
    const v=r[batKey]||'';
    if(b.has('민글자')&&(v==='민글자'||v==='')) return true;
    if(b.has('받침')&&(v==='받침'||v==='받침글자')) return true;
    return false;
  });

  // 첫닿자·홀자·받침닿자 — 각 그룹 내 OR, 그룹 간 AND
  if(cho.size||jung.size||jong.size) {
    rows = rows.filter(r => {
      const ch=(r[charKey]||'').trim(); if(!ch) return false;
      const d=decomposeHangul(ch); if(!d) return false;
      if(cho.size  && !cho.has(d.cho))  return false;
      if(jung.size && !jung.has(d.jung)) return false;
      if(jong.size) {
        const jv = d.jong===''?'없음':d.jong;
        if(!jong.has(jv)) return false;
      }
      return true;
    });
  }

  const sk = document.getElementById('sortCol').value;
  if(sk) rows=[...rows].sort((a,b2)=>{
    const av=parseFloat(a[sk]),bv=parseFloat(b2[sk]);
    if(!isNaN(av)&&!isNaN(bv)) return av-bv;
    return String(a[sk]||'').localeCompare(String(b2[sk]||''));
  });
  return rows;
}

// ── 파일 로드 ────────────────────────────────────────────────
function parseCSV(text){
  // BOM(UTF-8) 제거
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line => {
    // RFC 4180 파서 — 따옴표 안 쉼표 처리
    const vals = [];
    let i = 0;
    while (i <= line.length) {
      if (i === line.length) { vals.push(''); break; }
      if (line[i] === '"') {
        let val = '', j = i + 1;
        while (j < line.length) {
          if (line[j] === '"' && line[j+1] === '"') { val += '"'; j += 2; }
          else if (line[j] === '"') { j++; break; }
          else { val += line[j++]; }
        }
        vals.push(val);
        i = (line[j] === ',') ? j + 1 : j;
      } else {
        const end = line.indexOf(',', i);
        if (end === -1) { vals.push(line.slice(i)); break; }
        else { vals.push(line.slice(i, end)); i = end + 1; }
      }
    }
    const row = {};
    headers.forEach((h, idx) => { row[h] = (vals[idx] ?? '').trim(); });
    return row;
  }).filter(r => Object.values(r).some(v => v));
}

function parseXLSX(buffer){
  const wb=XLSX.read(buffer,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  return rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[k]=String(r[k]));return o;});
}

function addFile(name, rows){
  // 중복 이름 처리
  const existing=allFiles.findIndex(f=>f.name===name);
  if(existing>=0){allFiles[existing].rows=rows;}
  else{allFiles.push({name,rows});}
  curFileIdx=allFiles.findIndex(f=>f.name===name);
  renderFileList();
  renderContent();
}

function renderFileList(){
  const el=document.getElementById('fileList');
  if(!allFiles.length){el.innerHTML='<div style="padding:16px 12px;font-size:11px;color:var(--text-3);">불러온 파일 없음</div>';return;}
  el.innerHTML=allFiles.map((f,i)=>`
    <div class="file-item${i===curFileIdx?' is-active':''}" data-fi="${i}">
      <span class="file-item__icon">${f.name.endsWith('.csv')?'📄':'📊'}</span>
      <div class="file-item__info">
        <div class="file-item__name">${f.name}</div>
        <div class="file-item__meta">${f.rows.length}행</div>
      </div>
    </div>`).join('');
}

document.getElementById('fileList').addEventListener('click',e=>{
  const item=e.target.closest('[data-fi]');if(!item)return;
  curFileIdx=parseInt(item.dataset.fi);
  renderFileList();renderContent();
});

document.getElementById('btnClearFiles').addEventListener('click',()=>{
  if(!allFiles.length)return;
  if(!confirm('모든 파일을 삭제할까요?'))return;
  allFiles=[];curFileIdx=-1;renderFileList();renderContent();
});

// ── 로컬 파일 불러오기 ───────────────────────────────────────
document.getElementById('btnLoadLocal').addEventListener('click',()=>document.getElementById('localFileIn').click());
document.getElementById('localFileIn').addEventListener('change', e=>{
  for(const f of e.target.files){
    const name=f.name;
    if(name.endsWith('.csv')){
      const reader = new FileReader();
      reader.onload = ev => addFile(name, parseCSV(ev.target.result));
      reader.readAsText(f, 'UTF-8');
    } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
      const reader = new FileReader();
      reader.onload = ev => addFile(name, parseXLSX(new Uint8Array(ev.target.result)));
      reader.readAsArrayBuffer(f);
    }
  }
  e.target.value='';
});

// ── GitHub 파일 목록 ─────────────────────────────────────────
// ── GitHub 사이드바 탐색 ─────────────────────────────────────
let _ghCurPath = '';

async function ghSidebarLoad(path) {
  _ghCurPath = path;
  const cfg = ghLoadCfg();
  const listEl = document.getElementById('ghSidebarList');
  const pathEl = document.getElementById('ghSidebarPath');

  // 경로 표시
  if (!path) {
    pathEl.textContent = cfg.dataRepo || 'bojinjae';
  } else {
    pathEl.textContent = '/' + path;
  }

  if (!ghValid(cfg)) {
    listEl.innerHTML = '<div style="padding:10px 12px;font-size:11px;color:var(--text-3);">GitHub 설정이 필요합니다</div>';
    return;
  }

  listEl.innerHTML = '<div style="padding:10px 12px;font-size:11px;color:var(--text-3);">조회 중…</div>';

  try {
    const enc = path ? encodeURIComponent(path).replace(/%2F/g,'/') : '';
    const r = await fetch(
      `https://api.github.com/repos/${cfg.owner}/${cfg.dataRepo}/contents/${enc}`,
      {headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}}
    );
    if (!r.ok) { const e=await r.json(); throw new Error(e.message); }
    const items = await r.json();
    if (!Array.isArray(items)) throw new Error('파일 없음');

    const dirs  = items.filter(i => i.type==='dir');
    const files = items.filter(i => i.type==='file' && (i.name.endsWith('.csv')||i.name.endsWith('.xlsx')||i.name.endsWith('.bjj')));

    if (!dirs.length && !files.length) {
      listEl.innerHTML = '<div style="padding:10px 12px;font-size:11px;color:var(--text-3);">파일 없음</div>';
      return;
    }

    listEl.innerHTML =
      dirs.map(d => `
        <div class="file-item" data-ghdir="${d.name}" style="color:var(--accent);">
          <span class="file-item__icon">📁</span>
          <div class="file-item__info">
            <div class="file-item__name">${d.name}</div>
          </div>
        </div>`).join('') +
      files.map(f => `
        <div class="file-item" data-ghpath="${f.path}" data-ghname="${f.name}" style="cursor:pointer;">
          <span class="file-item__icon">${f.name.endsWith('.csv')?'📄':f.name.endsWith('.xlsx')?'📊':'📦'}</span>
          <div class="file-item__info">
            <div class="file-item__name">${f.name}</div>
            <div class="file-item__meta">${f.size?(f.size/1024).toFixed(0)+' KB':''}</div>
          </div>
        </div>`).join('');

  } catch(e) {
    listEl.innerHTML = `<div style="padding:10px 12px;font-size:11px;color:var(--err);">오류: ${e.message}</div>`;
  }
}

document.getElementById('ghSidebarList').addEventListener('click', async e => {
  // 폴더 진입
  const dirEl = e.target.closest('[data-ghdir]');
  if (dirEl) {
    const newPath = _ghCurPath ? _ghCurPath + '/' + dirEl.dataset.ghdir : dirEl.dataset.ghdir;
    ghSidebarLoad(newPath);
    return;
  }
  // 파일 로드
  const fileEl = e.target.closest('[data-ghpath]');
  if (!fileEl) return;
  const path = fileEl.dataset.ghpath;
  const name = fileEl.dataset.ghname;
  // 로딩 표시
  fileEl.style.background = 'var(--accent-bg)';
  await ghLoadFile(path, name);
  setTimeout(() => { fileEl.style.background = ''; }, 800);
});

document.getElementById('btnGhRefresh').addEventListener('click', () => ghSidebarLoad(_ghCurPath));
document.getElementById('btnGhUp').addEventListener('click', () => {
  if (!_ghCurPath) return;
  const up = _ghCurPath.includes('/') ? _ghCurPath.rsplit('/',1)[0] : '';
  // rsplit 미지원이므로
  const parts = _ghCurPath.split('/');
  parts.pop();
  ghSidebarLoad(parts.join('/'));
});

async function ghLoadFile(path,name){
  const cfg=ghLoadCfg();
  try{
    // Contents API
    const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.dataRepo}/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`,
      {headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}});
    if(!r.ok){const e=await r.json();throw new Error(e.message);}
    const d=await r.json();

    let rows;
    if(name.endsWith('.csv')){
      let text;
      if(d.content&&d.content.trim()){
        text=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
      } else if(d.sha){
        const br=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.dataRepo}/git/blobs/${d.sha}`,
          {headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json'}});
        const bd=await br.json();
        text=decodeURIComponent(escape(atob(bd.content.replace(/\n/g,''))));
      }
      rows=parseCSV(text);
    } else {
      // XLSX: base64 → ArrayBuffer
      const b64=d.content?d.content.replace(/\n/g,''):null;
      if(!b64) throw new Error('XLSX 파일이 너무 큽니다 (1MB 초과)');
      const binary=atob(b64);
      const buf=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) buf[i]=binary.charCodeAt(i);
      rows=parseXLSX(buf);
    }
    addFile(name,rows);
  }catch(e){
    alert('파일 로드 실패: '+e.message);
  }
}

function renderTable(rows,body){
  if(!rows.length) return;
  // 실제 파일 헤더를 그대로 사용 (하드코딩 X)
  const allCols = Object.keys(rows[0]);
  // 숫자형 컬럼 자동 감지
  const numCols = allCols.filter(c => {
    const sample = rows.find(r => r[c] !== '' && r[c] !== undefined);
    return sample && !isNaN(parseFloat(sample[c]));
  });
  // 주요 컬럼 앞에 배치, 나머지는 뒤에
  const priority = ['파일명','글자','모임꼴','받침여부','낱글자너비(mm)','낱글자높이(mm)','비례기준','비례값',
    '균형점X(Gu)','균형점Y(Gu)','편차X(Gu)','편차Y(Gu)','균형축각도(°)','픽셀수',
    // 구버전 헤더도 대응
    '너비(mm)','높이(mm)'];
  const cols = [
    ...priority.filter(c => allCols.includes(c)),
    ...allCols.filter(c => !priority.includes(c) && c !== '측정시각' && c !== '파일명'),
    ...allCols.filter(c => c === '측정시각')
  ];
  // 파일명은 너무 길어서 끝에
  const finalCols = ['글자', ...cols.filter(c => c !== '글자')];
  const dispCols = [...new Set(finalCols)].filter(c => allCols.includes(c));

  body.innerHTML=`<div style="overflow-x:auto;"><table class="data-table">
    <thead><tr>${dispCols.map(c=>`<th style="white-space:nowrap">${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${dispCols.map(c=>{
      const v=r[c]??'';
      if(c==='글자') return `<td class="char">${v}</td>`;
      if(numCols.includes(c)){
        const n=parseFloat(v);
        const isDevX = c==='편차X(Gu)' || c.includes('편차X');
        const isDevY = c==='편차Y(Gu)' || c.includes('편차Y');
        const col=!isNaN(n)&&(isDevX||isDevY)?(n>0?'color:var(--err)':n<0?'color:var(--accent)':''):'';
        return `<td class="num" style="${col}">${v}</td>`;
      }
      if(c==='파일명') return `<td style="font-size:10px;color:var(--text-3);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${v}">${v}</td>`;
      return `<td>${v}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function _col(row, ...candidates) {
  for (const c of candidates) if (c in row) return row[c] ?? '';
  return '';
}

function renderChart(rows,body){
  // 비례값 컬럼명 자동 감지 (구버전/신버전 모두 대응)
  const propKey = rows[0] && '비례값' in rows[0] ? '비례값' : Object.keys(rows[0]||{}).find(k=>k.includes('비례값'))||'비례값';
  const charKey = rows[0] && '글자' in rows[0] ? '글자' : '글자';
  const moimKey = rows[0] && '모임꼴' in rows[0] ? '모임꼴' : '모임꼴';
  const batKey  = rows[0] && '받침여부' in rows[0] ? '받침여부' : '받침여부';

  const sorted=[...rows].filter(r=>r[propKey]&&r[charKey]).sort((a,b)=>parseFloat(a[propKey])-parseFloat(b[propKey]));
  const maxV=Math.max(...sorted.map(r=>parseFloat(r[propKey])||0));
  const colors={'가로모임꼴':'#2563eb','세로모임꼴':'#16a34a','섞임모임꼴':'#d97706'};

  const vals=rows.map(r=>parseFloat(r[propKey])).filter(v=>!isNaN(v));
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const mn=vals.length?Math.min(...vals):0,mx=vals.length?Math.max(...vals):0;

  body.innerHTML=`
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-card__label">총 글자 수</div><div class="stat-card__val">${rows.length}</div><div class="stat-card__sub">측정 완료</div></div>
    <div class="stat-card"><div class="stat-card__label">비례값 평균</div><div class="stat-card__val">${avg.toFixed(3)}</div><div class="stat-card__sub">1:${avg.toFixed(3)}</div></div>
    <div class="stat-card"><div class="stat-card__label">최솟값</div><div class="stat-card__val">${mn.toFixed(3)}</div></div>
    <div class="stat-card"><div class="stat-card__label">최댓값</div><div class="stat-card__val">${mx.toFixed(3)}</div></div>
  </div>
  <div class="chart-wrap">
    <h3>비례값 (1:N) — 글자별</h3>
    <div class="bar-chart">${sorted.slice(0,60).map(r=>{
      const v=parseFloat(r[propKey])||0;
      const pct=maxV>0?v/maxV*100:0;
      const col=colors[r[moimKey]]||'#888';
      return `<div class="bar-row">
        <span class="bar-row__label">${r[charKey]}</span>
        <span class="bar-row__name">${r[moimKey]||''}${r[batKey]==='받침'?' 받침':''}</span>
        <div class="bar-row__track"><div class="bar-row__fill" style="width:${pct}%;background:${col}"></div></div>
        <span class="bar-row__val">${v.toFixed(3)}</span>
      </div>`;
    }).join('')}</div>
  </div>`;
}

  const keys = Object.keys(rows[0]||{});
  const dxKey = keys.find(k=>k.includes('편차X'))||'편차X(Gu)';

  const pts=rows.filter(r=>r[dxKey]!==undefined&&r[dyKey]!==undefined)

  const ticks=[-15,-10,-5,0,5,10,15];

    <line x1="${toSVG(t,false)}" y1="${PAD}" x2="${toSVG(t,false)}" y2="${SZ-PAD}" stroke="#e5e5e5" stroke-width="1"/>

      <text x="10" y="${SZ/2}" text-anchor="middle" font-size="10" fill="#555" transform="rotate(-90,10,${SZ/2})">편차 Y (Gu) ↑</text>

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
function stats(arr) {
  const a = arr.map(Number).filter(v => !isNaN(v) && v !== 0);
  if (!a.length) return { n:0, avg:'—', med:'—', min:'—', max:'—' };
  a.sort((x,y) => x-y);
  const avg = a.reduce((s,v)=>s+v,0)/a.length;
  const med = a.length%2===0 ? (a[a.length/2-1]+a[a.length/2])/2 : a[Math.floor(a.length/2)];
  return { n:a.length, avg:r2(avg), med:r2(med), min:r2(a[0]), max:r2(a[a.length-1]) };
}
function r2(n){ return Math.round(n*100)/100; }

function statRow(label, arr, cls='') {
  const s = stats(arr);
  return `<tr>
    <td class="td-label">${label}</td>
    <td class="td-n">${s.n}</td>
    <td class="td-avg">${s.avg}</td>
    <td class="td-med">${s.med}</td>
    <td class="td-min">${s.min}</td>
    <td class="td-max">${s.max}</td>
  </tr>`;
}


function multiStatRow(label, colArrs) {
  return `<tr>
    <td class="td-label">${label}</td>
    ${colArrs.map(arr => {
      const s = stats(arr);
      return `<td class="td-n">${s.n}</td><td class="td-avg">${s.avg}</td><td class="td-med">${s.med}</td><td class="td-min">${s.min}</td><td class="td-max">${s.max}</td>`;
    }).join('')}
  </tr>`;
}

function getCols(rows) {
  return rows.length ? Object.keys(rows[0]) : [];
}
function getKey(cols, ...candidates) {
  for (const c of candidates) if (cols.includes(c)) return c;
  return null;
}
function colVals(rows, key) {
  if (!key) return [];
  return rows.map(r=>parseFloat(r[key])).filter(v=>!isNaN(v)&&v!==0);
}

function groupBy(rows, keyFn) {
  const map = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  return map;
}

function renderCmpGlyph(rows,body,moimKey,batKey,charKey,cols) {
  if(!cols.length){body.innerHTML='<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">낱글자 관련 컬럼을 찾을 수 없습니다</div></div>';return;}
  let html='<div class="cmp-wrap">';
  for (const moim of MOIMS) {
    const mRows = rows.filter(r=>r[moimKey]===moim);
    if(!mRows.length) continue;
    const minRows = mRows.filter(r=>!r[batKey]||r[batKey]==='민글자'||r[batKey]==='');
    const batRows = mRows.filter(r=>r[batKey]==='받침'||r[batKey]==='받침글자');
    html += `<div class="cmp-section">
      <div class="cmp-section__title">${moim} <span class="badge">${mRows.length}행</span></div>
      <table class="cmp-table">${makeColHeader(cols)}<tbody>`;
    html += makeDataRow(`전체`, mRows, cols);
    if(minRows.length) html += makeDataRow(`└ 민글자`, minRows, cols);
    if(batRows.length) html += makeDataRow(`└ 받침글자`, batRows, cols);
    // 첫닿자별
    for (const cho of CHO_LIST) {
      const cRows = mRows.filter(r=>{const d=decomposeHangul((r[charKey]||'').trim());return d&&d.cho===cho;});
      if(cRows.length) html += makeDataRow(`  ㅣ ${cho}`, cRows, cols);
    }
    html += `</tbody></table></div>`;
  }
  html += '</div>';
  body.innerHTML = html;
}

function renderCmpComp(rows,body,moimKey,batKey,charKey,cols,title,type) {
  if(!cols.length){body.innerHTML=`<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">${title} 관련 컬럼을 찾을 수 없습니다</div></div>`;return;}
  let html='<div class="cmp-wrap">';
  for (const moim of MOIMS) {
    const mRows = rows.filter(r=>r[moimKey]===moim);
    if(!mRows.length) continue;
    html += `<div class="cmp-section">
      <div class="cmp-section__title">${moim} — ${title} <span class="badge">${mRows.length}행</span></div>
      <table class="cmp-table">${makeColHeader(cols)}<tbody>`;
    html += makeDataRow('전체', mRows, cols);
    const LIST = type==='cho'?CHO_LIST:type==='jung'?JUNG_LIST:JONG_LIST;
    for (const jamo of LIST) {
      const jRows = mRows.filter(r=>{
        const d=decomposeHangul((r[charKey]||'').trim()); if(!d) return false;
        if(type==='cho')  return d.cho===jamo;
        if(type==='jung') return d.jung===jamo;
        if(type==='jong') return jamo==='없음'?d.jong==='':d.jong===jamo;
        return false;
      });
      if(jRows.length) html += makeDataRow(`  ${jamo}`, jRows, cols);
    }
    html += `</tbody></table></div>`;
  }
  html += '</div>';
  body.innerHTML = html;
}

function renderGapStep(rows, body) {
  const cols = getCols(rows);
  const charKey = getKey(cols,'글자');
  const moimKey = getKey(cols,'모임꼴');
  let html = '<div class="cmp-wrap">';

  for (const moim of MOIMS) {
    const mRows = rows.filter(r=>r[moimKey]===moim);
    if(!mRows.length) continue;
    const defs = GAP_DEFS[moim]||[];
    // 측정된 컬럼만
    const activeDefs = defs.filter(d=>d.cols.some(c=>cols.includes(c)));
    if(!activeDefs.length) continue;

    html += `<div class="cmp-section">
      <div class="cmp-section__title">${moim} — 간격·단차 <span class="badge">${mRows.length}행</span></div>`;

    for (const def of activeDefs) {
      const aCols = def.cols.filter(c=>cols.includes(c));
      if(!aCols.length) continue;
      const cDefs = aCols.map(c=>({label:c.replace(def.label,'').replace('비율','비율').replace('비례%','비례%'),key:c}));
      html += `<table class="cmp-table" style="margin-bottom:6px;">
        ${makeColHeader(cDefs).replace(/>그룹</,`>${def.label}<`)}<tbody>`;
      html += makeDataRow('전체', mRows, cDefs);
      // 첫닿자별
      for (const cho of CHO_LIST) {
        const cRows = mRows.filter(r=>{const d=decomposeHangul((r[charKey]||'').trim());return d&&d.cho===cho;});
        if(cRows.length) html += makeDataRow(cho, cRows, cDefs);
      }
      html += `</tbody></table>`;
    }
    html += `</div>`;
  }
  html += '</div>';
  body.innerHTML = html;
}

function renderBalProp(rows, body) {
  const cols = getCols(rows);
  const charKey = getKey(cols,'글자');
  const moimKey = getKey(cols,'모임꼴');
  const batKey  = getKey(cols,'받침여부');

  const BAL_COLS = [
    {label:'균형점X(Gu)', key:getKey(cols,'균형점X(Gu)')},
    {label:'균형점Y(Gu)', key:getKey(cols,'균형점Y(Gu)')},
    {label:'편차X(Gu)',   key:getKey(cols,'편차X(Gu)')},
    {label:'편차Y(Gu)',   key:getKey(cols,'편차Y(Gu)')},
    {label:'균형축각도(°)',key:getKey(cols,'균형축각도(°)')},
  ].filter(c=>c.key);

  if(!BAL_COLS.length){
    body.innerHTML='<div class="empty"><div class="empty__icon">⚠️</div><div class="empty__text">균형 관련 컬럼을 찾을 수 없습니다</div></div>';
    return;
  }
  let html='<div class="cmp-wrap">';
  for (const moim of MOIMS) {
    const mRows = rows.filter(r=>r[moimKey]===moim);
    if(!mRows.length) continue;
    const minRows = mRows.filter(r=>!r[batKey]||r[batKey]==='민글자'||r[batKey]==='');
    const batRows = mRows.filter(r=>r[batKey]==='받침'||r[batKey]==='받침글자');

    html += `<div class="cmp-section">
      <div class="cmp-section__title">${moim} — 균형점 분포 <span class="badge">${mRows.length}행</span></div>
      <table class="cmp-table">${makeColHeader(BAL_COLS)}<tbody>`;
    html += makeDataRow('전체', mRows, BAL_COLS);
    if(minRows.length) html += makeDataRow('└ 민글자', minRows, BAL_COLS);
    if(batRows.length) html += makeDataRow('└ 받침글자', batRows, BAL_COLS);
    // 첫닿자별
    for (const cho of CHO_LIST) {
      const cRows = mRows.filter(r=>{const d=decomposeHangul((r[charKey]||'').trim());return d&&d.cho===cho;});
      if(cRows.length) html += makeDataRow(`  ${cho}`, cRows, BAL_COLS);
    }
    // 홀자별
    html += `<tr><td class="td-label" colspan="${BAL_COLS.length*4+2}" style="background:#f0efe9;font-size:10px;color:var(--text-3);font-weight:700;letter-spacing:.5px;">홀자별</td></tr>`;
    for (const jung of JUNG_LIST) {
      const jRows = mRows.filter(r=>{const d=decomposeHangul((r[charKey]||'').trim());return d&&d.jung===jung;});
      if(jRows.length) html += makeDataRow(`  ${jung}`, jRows, BAL_COLS);
    }
    html += `</tbody></table></div>`;
  }
  html += '</div>';
  body.innerHTML = html;
}
